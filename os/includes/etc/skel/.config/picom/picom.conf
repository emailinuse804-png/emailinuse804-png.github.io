# ============================================================================
# CursorOS v3 - Picom Compositor Configuration
# ============================================================================
# Provides macOS-like visual effects: shadows, transparency, blur, and
# smooth fading animations.
# ============================================================================

# ─── Backend ──────────────────────────────────────────────────────────────
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;
vsync = true;

# ─── Shadows ──────────────────────────────────────────────────────────────
shadow = true;
shadow-radius = 18;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.35;
shadow-color = "#000000";

shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "class_g = 'Plank'",
    "class_g = 'slop'",
    "_GTK_FRAME_EXTENTS@:c",
    "class_g = 'xfce4-screenshooter'",
    "class_g = 'xfce4-notifyd'",
];

# ─── Fading ───────────────────────────────────────────────────────────────
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

fade-exclude = [
    "class_g = 'slop'"
];

# ─── Opacity ──────────────────────────────────────────────────────────────
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
active-opacity = 1.0;

focus-exclude = [
    "class_g = 'Cairo-clock'"
];

opacity-rule = [
    "92:class_g = 'xfce4-terminal' && focused",
    "85:class_g = 'xfce4-terminal' && !focused",
    "95:class_g = 'Thunar' && !focused",
    "90:class_g = 'Plank'",
];

# ─── Rounded Corners ─────────────────────────────────────────────────────
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'xfce4-panel'",
    "class_g = 'Plank'",
];

# ─── Blur ─────────────────────────────────────────────────────────────────
blur-background = false;
blur-method = "dual_kawase";
blur-strength = 4;
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'slop'",
    "_GTK_FRAME_EXTENTS@:c",
];

# ─── Window Type Settings ─────────────────────────────────────────────────
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; };
    dock = { shadow = false; clip-shadow-above = true; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.95; shadow = true; };
    dropdown_menu = { opacity = 0.95; shadow = true; };
    notification = { shadow = true; };
};
